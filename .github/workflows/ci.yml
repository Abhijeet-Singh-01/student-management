name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Build, Migrate & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: studentdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studentdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🚀 Run Database Migrations & Seeds
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: "1234"
          DB_NAME: studentdb
          JWT_SECRET: ci_pipeline_jwt_secret_key_testing_12345
        run: node src/database/migrate.js

      - name: ⚡ Start Application Server
        env:
          PORT: 3000
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: "1234"
          DB_NAME: studentdb
          JWT_SECRET: ci_pipeline_jwt_secret_key_testing_12345
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          node server.js &
          echo "Waiting for server to become healthy..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health | grep -q '"status":"UP"'; then
              echo "Server is UP and ready!"
              break
            fi
            sleep 1
          done

      - name: 🧪 Execute 26 Automated Integration Tests
        env:
          TEST_URL: http://localhost:3000
        run: npm test

      - name: 🐳 Verify Production Docker Build
        run: docker build -t student-management-api:ci .
